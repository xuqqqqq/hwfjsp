; FJSP 调度求解与校验配置模板
; 说明：
; 1. 本文件沿用原可视化工具 config.ini 的 INI 风格。
; 2. [constraints] 用于声明约束是否启用；求解器与校验器应读取同一份约束配置。
; 3. [hyper_params] 用于声明启发式调度评分参数；仅影响搜索倾向，不改变问题合法性口径。
; 4. true 表示启用，false 表示关闭。若关闭硬约束，生成结果只能作为放松实验结果使用。

[io]
; 输入算例文件。接口集成时可由外部参数覆盖。
input_path = data/data1/测试算例1.json

; 输出解文件。
output_path = outputs/test_case1_24480/best_finite.json

; 求解模式：relaxed 表示组批机器按无限产能处理；finite 表示启用有限组批容量。
track = finite

; 产量统计截止时间。留空时从算例 JSON 中读取 max_output_horizon。
horizon =

; 是否重建解析缓存。算例文件或约束口径变化后建议设为 true。
rebuild_cache = false


[constraints]
; 工件释放时间约束：工序不得早于工件最早可用时间开工。
release_time = true

; 最大生产间隔约束：相邻受控工序之间不得超过最大 Q-time。
max_time_lag = true

; 最小生产间隔约束：相邻受控工序之间不得小于最小 Q-time。
min_time_lag = true

; 顺序相关换型约束：同一设备前后任务切换时必须考虑 setup time。
sequence_dependent_setup = true

; 可选加工路径约束：工件必须选择输入数据允许的加工路径。
alternative_routes = true

; 设备维修窗口约束：工序加工区间不得与设备不可用时间段重叠。
maintenance_windows = true

; 跨厂转运约束：跨厂/跨设备转移必须满足允许关系和转运时间。
inter_factory_transport = true

; 工件优先级特性：启用后算法可在评分中考虑优先级；该项通常不是硬合法性约束。
job_priority = true

; 并行组批特性：启用后识别 p-batch 设备和组批规则。
parallel_batch = true

; 以下为当前求解器/校验器需要的细粒度合法性开关。

; 完整解约束：解中必须包含全部工件。
require_all_tasks = true

; 完整路径约束：每个工件必须排完所选路径上的全部工序。
require_complete_route = true

; 路径一致性约束：解中的 path_id 必须与该工件选定路径一致。
path_id_consistency = true

; 候选设备约束：工序只能安排到其候选设备集合内的设备。
candidate_machine = true

; 加工时长约束：非组批工序时长必须等于候选设备给定加工时长。
process_duration = true

; 工序前后约束：同一工件内后续工序不得早于前序工序完工及必要转运后开工。
process_precedence = true

; 普通设备容量约束：非组批设备同一时间只能加工一道工序。
machine_capacity = true

; 组批有限产能开关：true 表示 p-batch 设备也按有限设备容量校验；false 表示组批无限产能。
finite_batch_capacity = true

; 组批同族约束：同一批次内工序必须属于同一 family。
batch_family = true

; 组批容量约束：同一批次数量不得超过设备/工艺允许容量。
batch_capacity = true

; 组批加工时长约束：同一批次加工时长按批内工序加工时长最大值计算。
batch_duration_max = true

; 组批设备不重叠约束：有限组批模式下，同一组批设备不同批次不得时间重叠。
batch_machine_no_overlap = true

; 产量统计口径：true 表示只统计 horizon 内完成的工件。
horizon_output = true

; setup 统计口径：true 表示只统计 setuptime > 0 的切换次数。
positive_setup_count = true


[hyper_params]
; 第一阶段候选窗口，单位为分钟。只在当前最早可行时间附近选择候选动作。
lookahead = 70

; 截止线保护窗口，单位为分钟。越大越倾向于提前避免临近截止线的风险任务。
start_guard = 360

; 工件权重得分系数。越大越偏向高产量权重工件。
score_weight = 340

; 单位剩余加工时间密度系数。越大越偏向短剩余时间、高收益任务。
score_density = 23500

; 已开工工件奖励。越大越倾向于优先补完已开始但未完成的工件。
score_started = 140

; 同族连续加工奖励。越大越倾向于减少换型。
score_family = 400

; 工序进度奖励。越大越倾向于推进路径后段工序。
score_progress = 0

; 零换型奖励。越大越偏好 setuptime = 0 的候选动作。
score_zero_setup = 0

; 正换型固定惩罚。发生 setuptime > 0 时扣除。
score_setup_fixed = 390

; 正换型时长惩罚。按 setuptime 线性扣除。
score_setup_per = 4

; 预计完工时间惩罚。越大越偏向更早完工的候选动作。
score_est_final_per = 0.01

; 第二阶段已开工工件奖励。用于补齐完整解和收尾阶段。
phase2_started = 2200

; 第二阶段密度系数。
phase2_density = 6900

; 第二阶段同族奖励。
phase2_family = 560

; 第二阶段工序进度奖励。
phase2_progress = 0

; 第二阶段零换型奖励。
phase2_zero_setup = 0

; 第二阶段正换型固定惩罚。
phase2_setup_fixed = 500

; 第二阶段正换型时长惩罚。
phase2_setup_per = 4

; 第二阶段完工时间惩罚。
phase2_finish_per = 0.01

; 第二阶段是否允许选择尚未开工工件。true 表示允许，false 表示优先补已开工工件。
phase2_allow_unstarted = true

; 自动生成扰动解数量。用于快速生成若干参数变体。
variation_count = 4

; 扰动基础倍率。
variation_base_factor = 0.9

; 扰动倍率步长。
variation_factor_step = 0.05


[batch_policy]
; 有限组批模式下，同批候选允许等待的最大时间差，单位为分钟。
batch_group_wait = 320

; 是否允许同批工序具有不同加工时长；批时长仍按最大加工时长计算。
batch_group_mixed_time = true

; 是否允许更宽松的同批时间合并策略。
batch_group_any_time = false


[local_adjustments]
; 局部任务奖励，格式：task_id:bonus,task_id:bonus。空值表示不使用。
task_bonus =

; 延后任务集合，格式：task_id,task_id。空值表示不使用。
defer_tasks =

; 强制设备映射，格式：task_id:process_seq:machine_id,task_id:process_seq:machine_id。
force_machine =

; 强制路径映射，格式：task_id:path_id,task_id:path_id。
force_path =


[auto_tune]
; 是否启用自动调参。普通单次求解建议设为 false。
enabled = false

; 自动调参最大运行次数。
max_runs = 100

; 随机种子。固定后便于复现实验。
seed = 20260512

; 每轮自动生成的候选参数组数量。
auto_round_size = 4

; 每轮保留的优秀参数组数量。
auto_elite_size = 6

; setup 惩罚权重。越大越偏向低 setup 解。
auto_setup_penalty = 0.2


[validation]
; 校验输出的最大错误详情数量。留空或 0 表示不截断。
max_errors = 20

; 校验报告输出路径。留空表示只打印到控制台。
report_path =
